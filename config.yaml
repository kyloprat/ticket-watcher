# ─────────────────────────────────────────────────────────────
# Ticket Watcher – site & behaviour config
# What to watch lives in trackers.json (edit it or use Telegram commands).
# This file describes HOW each site is checked. Adding a new site = adding
# a block under `providers:` – no code changes needed.
# ─────────────────────────────────────────────────────────────

settings:
  timezone: Asia/Kolkata
  # Warn on Telegram after this many consecutive failed checks of one site
  # (e.g. the site started blocking the bot). Sent once, until it recovers.
  error_alert_after: 6
  # Daily "still watching" summary at this local hour (0-23). null = off.
  heartbeat_hour: 10
  # Plain HTTP works for BookMyShow and District (checked live 2026-10-26).
  # BookMyShow's bot protection blocks the headless browser even from a home
  # connection, so the browser stays off. Use auto/always only for a site that
  # needs JavaScript (and `pip install playwright` + `playwright install chromium`).
  use_browser: never       # auto | always | never
  page_wait_seconds: 4     # extra time for JS to render each page (browser only)

# Common names → the slug ticket sites use in URLs.
city_aliases:
  bangalore: bengaluru
  blr: bengaluru
  bombay: mumbai
  madras: chennai
  calcutta: kolkata
  gurgaon: gurugram
  trivandrum: thiruvananthapuram
  cochin: kochi
  vizag: visakhapatnam

# Text that means "you've been blocked", not "page loaded".
block_markers:
  - "access denied"
  - "verify you are human"
  - "are you a robot"
  - "attention required"
  - "request blocked"
  - "unusual traffic"
  - "you have been blocked"     # Cloudflare block page (seen on BookMyShow)

providers:
  bookmyshow:
    name: BookMyShow
    enabled: true
    # {city} is replaced by the city slug. Every listing page is scanned for
    # a link matching the movie name; that movie page is then checked.
    listing_urls:
      - "https://in.bookmyshow.com/explore/movies-{city}"
      - "https://in.bookmyshow.com/explore/upcoming-movies-{city}"
    link_must_contain: ["/movies/"]
    # Plain-HTTP listings link to /movies/<slug>/ET…, which has no city and never
    # shows "Book tickets"; check the city page /movies/{city}/<slug>/ET… instead.
    link_rewrite: ['/movies/([a-z0-9-]+)/(ET\d+)/?$', '/movies/{city}/\1/\2']
    city_slugs:            # site-specific overrides
      delhi: national-capital-region-ncr
      ncr: national-capital-region-ncr
      noida: national-capital-region-ncr
    # Button/link texts on the movie page (/movies/{city}/<slug>/ET…).
    # Live 2026-10-26: a bookable film shows "Book tickets"; Doomsday shows "I'm interested".
    open_phrases: ["book tickets", "book now"]
    closed_phrases: ["i'm interested", "im interested", "coming soon", "releasing on"]

  district:
    name: District
    enabled: true
    # District's movie pages are per city: …/<slug>-movie-tickets-in-{city}-MV…
    listing_urls:
      - "https://www.district.in/movies/{city}-movie-tickets"
      - "https://www.district.in/movies/upcoming-movies-in-{city}"
    link_must_contain: ["/movies/", "-in-{city}-"]
    city_slugs: {}
    # A bookable District movie page lists showtimes ("10:35 PM", "11:05 AM IMAX")
    # instead of a "Book tickets" button; its FAQ/footer says "book tickets" on
    # every movie page, so only button labels count.
    open_phrases: []
    open_patterns: ['\b\d{1,2}:\d{2}\s?[AP]M\b']
    closed_phrases: ["coming soon", "notify me"]

  pvr:
    name: PVR INOX
    # Off by default: PVR's URL layout changes often. Open pvrcinemas.com in a
    # browser, pick your city, copy the "Now Showing" URL here (use {city}),
    # then set enabled: true.
    enabled: false
    listing_urls:
      - "https://www.pvrcinemas.com/{city}/now-showing"
    link_must_contain: []
    city_slugs: {}
    open_phrases: ["book tickets", "book now", "buy tickets"]
    closed_phrases: ["coming soon", "notify me"]
