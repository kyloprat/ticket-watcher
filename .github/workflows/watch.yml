name: ticket-watch

on:
  schedule:
    # Every 10 minutes (UTC). GitHub often runs scheduled jobs late or skips them;
    # for punctual checks, also trigger "Run workflow" from cron-job.org (README).
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probe only: print results, send nothing, save nothing"
        type: boolean
        default: false

permissions:
  contents: write            # to save state.json / trackers.json back

concurrency:
  group: ticket-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Probe (dry run)
        if: ${{ inputs.dry_run }}
        run: python -m watcher run --dry-run

      - name: Check
        if: ${{ !inputs.dry_run }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m watcher run

      - name: Save state
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name  "ticket-watcher-bot"
          git config user.email "ticket-watcher-bot@users.noreply.github.com"
          git add state.json trackers.json
          git diff --cached --quiet || git commit -m "watcher state $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase --autostash || true
          git push || true
